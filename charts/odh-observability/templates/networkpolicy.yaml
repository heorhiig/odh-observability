apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "odh-observability.fullname" . }}-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "odh-observability.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "odh-observability.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - protocol: TCP
      port: 8080
    from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Values.monitoringNamespace }}

  - ports:
    - protocol: TCP
      port: 8081

  - ports:
    - protocol: TCP
      port: 9443
    from:
    - ipBlock:
        cidr: 10.0.0.0/8
