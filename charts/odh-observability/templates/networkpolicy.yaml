apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "odh-observability.fullname" . }}-manager
  namespace: {{ .Values.operatorNamespace }}
  labels:
    {{- include "odh-observability.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "odh-observability.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  ingress:
  # Metrics (8443/HTTPS) — ingress only from supported monitoring namespaces
  - ports:
    - protocol: TCP
      port: 8443
    from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ include "odh-observability.monitoringNamespace" . }}
  # Health-probe (8081) — ingress from all sources
  # Rationale: kubelet/node-originated probes are not reliably constrainable via
  # NetworkPolicy peer selectors since they originate from the node's host network.
  # Restricting this port would break liveness/readiness checks during operator restarts.
  - ports:
    - protocol: TCP
      port: 8081
  # Webhook (9443) — ingress from API-server CIDR
  - ports:
    - protocol: TCP
      port: 9443
    from:
    - ipBlock:
        cidr: 10.0.0.0/8
