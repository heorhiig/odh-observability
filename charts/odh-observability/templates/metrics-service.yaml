apiVersion: v1
kind: Service
metadata:
  name: {{ include "odh-observability.fullname" . }}-metrics
  namespace: {{ .Values.operatorNamespace }}
  labels:
    {{- include "odh-observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: {{ include "odh-observability.fullname" . }}-metrics-tls
spec:
  ports:
    - name: https
      port: 8443
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "odh-observability.selectorLabels" . | nindent 4 }}
