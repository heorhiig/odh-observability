nameOverride: ""
fullnameOverride: ""

operatorNamespace: opendatahub-operator-system

# Namespace of the Red Hat build of OpenTelemetry Operator. The supplemental
# ClusterRoleBinding grants it cert-manager access for TargetAllocator mTLS.
otelOperatorNamespace: openshift-opentelemetry-operator

# Namespace where Monitoring operands (Tempo, collector) are deployed.
# Tempo write ACL treats this namespace name as the RBAC resource.
# Defaults to operatorNamespace when empty. On RHOAI this is
# spec.monitoring.namespace (e.g. redhat-ods-monitoring).
monitoringNamespace: ""

# Namespace containing the external router or gateway that reaches the
# monitoring proxies. Empty retains the OpenShift ingress policy-group
# selector, while deployment overlays may provide a namespace-specific source.
gatewayNamespace: ""

image:
  repository: quay.io/opendatahub/odh-observability
  tag: odh-stable
  pullPolicy: Always

replicaCount: 1

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Leader election - enable when running multiple replicas.
leaderElect: false

# Webhook admission policy configuration.
# failurePolicy controls what happens when the webhook is unavailable.
# Use Ignore (default) for single-replica deployments to avoid blocking
# PodMonitor/ServiceMonitor admission during operator restarts or node drains.
# Switch to Fail only after enabling HA (replicaCount >= 2, leaderElect: true).
webhook:
  failurePolicy: Ignore

# Image pull secrets for private registries.
imagePullSecrets: []

# Node selector, tolerations, and affinity for the controller pod.
nodeSelector: {}
tolerations: []
affinity: {}

# Extra environment variables injected into the controller container.
# Use for RELATED_IMAGE_* overrides.
env: []
# - name: RELATED_IMAGE_PERSES_IMAGE
#   value: "registry.redhat.io/cluster-observability-operator/perses-rhel9:1.5.0-1781116652"

# Metrics configuration
metrics:
  # ServiceAccount that Prometheus uses to scrape the operator /metrics endpoint.
  # Created by the MonitoringStack as <monitoringstack-name>-prometheus; granted
  # read access to /metrics via the metrics-reader ClusterRoleBinding.
  prometheusServiceAccount: data-science-monitoringstack-prometheus
  serviceMonitor:
    # Enable operator metrics ServiceMonitor creation.
    #
    # This MUST be enabled on supported deployments: the operator /metrics
    # endpoint is the only source for the webhook health signals, and the
    # following alerts are silently non-functional without it:
    #   - MonitoringWebhookAdmissionErrors  (controller_runtime_webhook_requests_total)
    #   - MonitoringWebhookAdmissionPathDown (webhook_admission_probe_* metrics)
    #
    # Disable ONLY on clusters where the ServiceMonitor CRD
    # (monitoring.rhobs/v1 or monitoring.coreos.com/v1) is not yet installed;
    # otherwise `helm install` fails with "no matches for kind ServiceMonitor".
    enabled: true
    # API version for ServiceMonitor (monitoring.rhobs/v1 for COO, monitoring.coreos.com/v1 for upstream)
    apiVersion: monitoring.rhobs/v1
