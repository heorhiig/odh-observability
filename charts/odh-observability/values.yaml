nameOverride: ""
fullnameOverride: ""

operatorNamespace: opendatahub-operator-system

# Namespace where Monitoring operands (Tempo, collector) are deployed.
# Tempo write ACL treats this namespace name as the RBAC resource.
# Defaults to operatorNamespace when empty. On RHOAI this is
# spec.monitoring.namespace (e.g. redhat-ods-monitoring).
# Also used as the allowed source for operator metrics NetworkPolicy ingress.
monitoringNamespace: ""

image:
  repository: quay.io/opendatahub/odh-observability
  tag: odh-stable
  pullPolicy: Always

replicaCount: 1

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Leader election - enable when running multiple replicas.
leaderElect: false

# Image pull secrets for private registries.
imagePullSecrets: []

# Node selector, tolerations, and affinity for the controller pod.
nodeSelector: {}
tolerations: []
affinity: {}

# Extra environment variables injected into the controller container.
# Use for RELATED_IMAGE_* overrides.
env: []
# - name: RELATED_IMAGE_PERSES_IMAGE
#   value: "registry.redhat.io/cluster-observability-operator/perses-rhel9:1.5.0-1781116652"
# NetworkPolicy CIDR allowlist for kube-apiserver webhook ingress to port 9443.
# Defaults cover OpenShift service + pod networks. Override for managed services
# (ROSA, ARO) or non-standard topologies where API server is external.
webhookIngressCIDRs:
  - 172.30.0.0/16  # OpenShift service network
  - 10.128.0.0/14  # OpenShift pod network

metrics:
  # Enable ServiceMonitor resource creation for Prometheus Operator.
  serviceMonitor:
    enabled: true
    # API version for ServiceMonitor:
    # - monitoring.rhobs/v1: RHOBS Cluster Observability Operator (production RHOAI)
    # - monitoring.coreos.com/v1: Upstream Prometheus Operator
    apiVersion: monitoring.rhobs/v1